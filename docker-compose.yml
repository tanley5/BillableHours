services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
      - n8n

  api:
    build: ./backend
    env_file: .env
    environment:
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/billable-events}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-http://stripe-sim:12111}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_sim}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_sim}
    volumes:
      - ./backend:/app
      - photo_storage:/media
    depends_on:
      db:
        condition: service_healthy
      n8n:
        condition: service_started
      stripe-sim:
        condition: service_started
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  stripe-sim:
    build: ./stripe-sim
    ports:
      - "12111:12111"
    environment:
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_sim}
      STRIPE_SIM_WEBHOOK_URL: http://api:8000/api/stripe/webhook/
      STRIPE_SIM_PUBLIC_BASE: http://localhost:12111

  web:
    build: ./frontend
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billable
      POSTGRES_USER: billable
      POSTGRES_PASSWORD: billable
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billable -d billable"]
      interval: 3s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:1.64.0
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost/n8n/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    expose:
      - "5678"

volumes:
  pgdata:
  photo_storage:
  n8n_data:
