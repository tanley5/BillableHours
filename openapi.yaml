        schema:
          type: integer
        required: true
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '204':
          description: No response body
  /api/c/{token}/visits/{id}/resubmit/:
    post:
      operationId: api_c_visits_resubmit_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/jobs/{id}/approve/:
    post:
      operationId: api_jobs_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/jobs/{id}/dispute/:
    post:
      operationId: api_jobs_dispute_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/photos/{id}/:
    get:
      operationId: api_photos_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/projects/:
    get:
      operationId: api_projects_list
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: api_projects_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/:
    get:
      operationId: api_projects_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
  /api/projects/{id}/assignments/:
    post:
      operationId: api_projects_assignments_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/projects/{id}/export.csv:
    get:
      operationId: api_projects_export.csv_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/projects/{id}/jobs/:
    get:
      operationId: api_projects_jobs_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
          description: ''
  /api/projects/{id}/visits/:
    get:
      operationId: api_projects_visits_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
          description: ''
  /api/visits/{id}/approve/:
    post:
      operationId: api_visits_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/visits/{id}/dispute/:
    post:
      operationId: api_visits_dispute_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    Job:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assignment:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 200
        parent:
          type: integer
          nullable: true
        notes:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/JobStatusEnum'
          readOnly: true
        client_comment:
          type: string
          readOnly: true
          nullable: true
        is_found_issue:
          type: boolean
          readOnly: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
          readOnly: true
        found_issues:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        supersedes:
          type: integer
          readOnly: true
          nullable: true
      required:
      - assignment
      - client_comment
      - created_at
      - found_issues
      - id
      - is_found_issue
      - label
      - photos
      - status
      - supersedes
      - updated_at
    JobStatusEnum:
      enum:
      - open
      - complete
      - approved
      - disputed
      type: string
      description: |-
        * `open` - Open
        * `complete` - Complete
        * `approved` - Approved
        * `disputed` - Disputed
    KindEnum:
      enum:
      - before
      - after
      type: string
      description: |-
        * `before` - Before
        * `after` - After
    Photo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        url:
          type: string
          readOnly: true
        captured_at:
          type: string
          format: date-time
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        location_missing:
          type: boolean
          readOnly: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - captured_at
      - id
      - kind
      - latitude
      - location_missing
      - longitude
      - uploaded_at
      - url
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        scope:
          type: string
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - scope
      - updated_at
    ProjectDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        scope:
          type: string
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        totals:
          type: string
          readOnly: true
        assignments:
          type: string
          readOnly: true
      required:
      - assignments
      - created_at
      - id
      - name
      - scope
      - totals
      - updated_at
    Visit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assignment:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        notes:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/VisitStatusEnum'
          readOnly: true
        client_comment:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        supersedes:
          type: integer
          readOnly: true
          nullable: true
      required:
      - assignment
      - client_comment
      - created_at
      - date
      - hours
      - id
      - status
      - supersedes
      - updated_at
    VisitStatusEnum:
      enum:
      - pending
      - approved
      - disputed
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `disputed` - Disputed
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
