openapi: 3.0.3
info:
  title: Billable Hours Tracker API
  version: 1.0.0
  description: Single-tenant contractor billable hours tracker (local Docker).
paths:
  /api/assignments/{id}/revoke/:
    post:
      operationId: api_assignments_revoke_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/c/{token}/:
    get:
      operationId: api_c_retrieve
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/c/{token}/jobs/:
    get:
      operationId: api_c_jobs_retrieve
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
    post:
      operationId: api_c_jobs_create
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/c/{token}/jobs/{id}/:
