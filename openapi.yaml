          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/c/{token}/jobs/{id}/resubmit/:
    post:
      operationId: api_c_jobs_resubmit_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/c/{token}/photos/{id}/:
    get:
      operationId: api_c_photos_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/c/{token}/visits/:
    get:
      operationId: api_c_visits_retrieve
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
    post:
      operationId: api_c_visits_create
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/c/{token}/visits/{id}/:
    patch:
      operationId: api_c_visits_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
