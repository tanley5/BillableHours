        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_c_jobs_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '204':
          description: No response body
  /api/c/{token}/jobs/{id}/photos/:
    post:
      operationId: api_c_jobs_photos_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: token
